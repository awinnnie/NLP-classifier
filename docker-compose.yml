version: "3.10"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: news-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: news-frontend
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8000
    restart: unless-stopped

